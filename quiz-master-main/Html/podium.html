<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التتويج النهائية | Kokquiz</title>
  <link rel="stylesheet" href="../CSS/podium.css">

  <style>
    /* ---------- زرار "عرض كل المراكز" ---------- */
    .ko-all-btn {
      position: fixed;
      inset-inline-start: 22px;
      bottom: 22px;
      z-index: 30;
      padding: 13px 28px;
      border: 0;
      border-radius: 999px;
      font: 800 1.05rem inherit;
      font-family: inherit;
      color: #0B1E36;
      background: linear-gradient(180deg, #F6DE9C, #E5B869);
      box-shadow: 0 5px 0 #BD9147, 0 10px 22px rgba(0,0,0,.4);
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity .5s, transform .5s;
    }
    .ko-all-btn.ko-ready { opacity: 1; transform: none; pointer-events: auto; }
    .ko-all-btn:hover { filter: brightness(1.05); }
    .ko-all-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #BD9147; }

    /* ---------- نافذة كل المراكز ---------- */
    .ko-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: none; flex-direction: column; align-items: center;
      padding: 26px 16px 40px;
      overflow-y: auto;
      background: rgba(7, 19, 34, .94);
      backdrop-filter: blur(8px);
      color: #fff;
    }
    .ko-overlay.ko-open { display: flex; }
    .ko-close {
      position: fixed; top: 16px; inset-inline-end: 20px;
      width: 46px; height: 46px; border: 0; border-radius: 50%;
      font: 900 1.3rem inherit; font-family: inherit;
      background: #fff; color: #0B1E36; cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    .ko-head { text-align: center; margin-bottom: 20px; }
    .ko-cross { color: #F3D27A; font-size: 2.2rem; line-height: 1; text-shadow: 0 0 18px rgba(243,210,122,.75); }
    .ko-title {
      margin: 4px 0 0;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(180deg, #FFF3C4 0%, #E5B869 55%, #BD9147 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
    }
    .ko-sub { margin-top: 6px; font-weight: 800; font-size: .9rem; letter-spacing: 3px; opacity: .7; }

    .ko-list { width: min(860px, 94vw); display: flex; flex-direction: column; gap: 12px; }
    .ko-row {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 12px 14px; border-radius: 18px; overflow: hidden;
      background: linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 8px 22px rgba(0,0,0,.3);
      opacity: 0; transform: translateY(24px) scale(.97);
      animation: koIn .55s cubic-bezier(.2,.9,.3,1.2) forwards;
      animation-delay: calc(var(--i) * 90ms);
    }
    .ko-row > * { position: relative; z-index: 1; }
    .ko-fill {
      position: absolute !important; z-index: 0 !important;
      inset-block: 0; inset-inline-start: 0; width: var(--w);
      background: linear-gradient(270deg, rgba(229,184,105,.04), rgba(229,184,105,.42));
      transform: scaleX(0); transform-origin: right;
      animation: koFill .9s ease-out forwards;
      animation-delay: calc(var(--i) * 90ms + 250ms);
    }
    [dir="ltr"] .ko-fill, .ko-overlay[dir="ltr"] .ko-fill { transform-origin: left; }
    .ko-rank {
      flex: 0 0 auto; width: 50px; height: 50px; display: grid; place-items: center;
      border-radius: 50%; font-weight: 900; font-size: 1.5rem;
      background: rgba(19,104,206,.85);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.3);
    }
    .ko-av { flex: 0 0 auto; font-size: 2rem; line-height: 1; }
    .ko-name { flex: 1 1 auto; min-width: 0; font-weight: 800; font-size: clamp(1.1rem, 2.4vw, 1.6rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ko-pts { flex: 0 0 auto; font-weight: 900; font-size: clamp(1.2rem, 2.6vw, 1.8rem); }
    .ko-pts small { font-weight: 700; font-size: .8rem; opacity: .75; margin-inline-start: 6px; }
    .ko-row.r1 { border-color: #F3D27A; box-shadow: 0 0 0 2px rgba(243,210,122,.35), 0 10px 30px rgba(229,184,105,.35); }
    .ko-row.r1 .ko-rank { background: linear-gradient(135deg, #FFF0A8, #DAA520); color: #3b2a00; }
    .ko-row.r2 .ko-rank { background: linear-gradient(135deg, #F2F2F2, #9E9E9E); color: #26303a; }
    .ko-row.r3 .ko-rank { background: linear-gradient(135deg, #E9A765, #8B4513); color: #fff; }

    @keyframes koIn { to { opacity: 1; transform: none; } }
    @keyframes koFill { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .ko-row, .ko-fill { animation: none; opacity: 1; transform: none; } }
  </style>

  <!-- استدعاء المكتبة الاحتفالية مرة واحدة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- السكربتات المحدثة بالترتيب السليم -->
  <script src="../JS/audio-engine.js" defer></script>
  <script src="../JS/celebration-fx.js" defer></script>
  <script src="../JS/podium-controller.js" defer></script>
</head>
<body>
  <div class="podium-screen">
    <header class="quiz-header">
      <div class="quiz-title-box" id="quizTitle">نتائج المسابقة النهائية</div>
      <button class="exit-btn" onclick="window.location.href='adminn.html'">لوحة التحكم ✕</button>
    </header>

    <main class="podium-stage">
      <section class="podium-column rank-2" id="rank-2-col">
        <div class="character-holder">
          <div class="points-pill" id="points-2">0 نقطة</div>
          <div class="avatar" id="avatar-2">🐼</div>
          <span class="player-name" id="name-2">--</span>
        </div>
        <div class="pedestal pedestal-2">
          <div class="badge-polygon">2</div>
        </div>
      </section>

      <section class="podium-column rank-1" id="rank-1-col">
        <div class="spotlight" id="winnerSpotlight"></div>
        <div class="character-holder">
          <div class="crown-icon">👑</div>
          <div class="points-pill" id="points-1">0 نقطة</div>
          <div class="avatar winner-avatar" id="avatar-1">🐊</div>
          <span class="player-name winner-name" id="name-1">--</span>
        </div>
        <div class="pedestal pedestal-1">
          <div class="badge-polygon">1</div>
        </div>
      </section>

      <section class="podium-column rank-3" id="rank-3-col">
        <div class="character-holder">
          <div class="points-pill" id="points-3">0 نقطة</div>
          <div class="avatar" id="avatar-3">🦁</div>
          <span class="player-name" id="name-3">--</span>
        </div>
        <div class="pedestal pedestal-3">
          <div class="badge-polygon">3</div>
        </div>
      </section>
    </main>

    <div id="no-results-alert" style="display: none;" class="no-results-toast">
      لا توجد نتائج مسجلة حتى الآن في هذه الجلسة.
    </div>

    <footer class="crowd-section">
      <div class="crowd-avatar">🐸</div>
      <div class="crowd-avatar">🐻</div>
      <div class="crowd-avatar">🐧</div>
      <div class="crowd-avatar">🐶</div>
      <div class="crowd-avatar">🐱</div>
      <div class="crowd-avatar">🦊</div>
    </footer>
  </div>

  <!-- زرار ونافذة كل المراكز -->
  <button class="ko-all-btn" id="showAllBtn" type="button">عرض كل المراكز</button>

  <div class="ko-overlay" id="allOverlay">
    <button class="ko-close" id="allClose" type="button" aria-label="إغلاق">✕</button>
    <div class="ko-head">
      <div class="ko-cross">✝</div>
      <h2 class="ko-title">كل المراكز</h2>
      <div class="ko-sub" id="allSub"></div>
    </div>
    <div class="ko-list" id="allList"></div>
  </div>
</body>
</html>
