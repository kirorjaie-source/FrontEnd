<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host Game | Kokquiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/host-gamen.css">
  <link rel="stylesheet" href="../CSS/countdown.css">
  <link rel="stylesheet" href="../CSS/host-mobile.css">
  <style>
    /* منع أي خروج أفقي أو عناصر مقصوصة على اليمين */
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }

    /* الهيدر العلوي وترتيب الزرار مع العداد */
    .game-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 12px 24px !important;
      gap: 12px !important;
      position: relative !important;
      z-index: 30 !important;
    }

    .header-left-spacer {
      min-width: 110px;
    }

    .header-right-controls {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      min-width: 110px;
      justify-content: flex-end !important;
    }

    /* زرار Skip / Next فوق بدل ما يغطي على الاختيار الأخضر */
    #btn-next {
      position: static !important;
      padding: 9px 20px !important;
      border: 2px solid #E4B93C !important;
      border-radius: 10px !important;
      font: 800 0.95rem 'Montserrat', sans-serif !important;
      background: #ffffff !important;
      color: #0B1E36 !important;
      cursor: pointer !important;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25) !important;
      transition: transform 0.15s ease, background 0.15s ease !important;
      white-space: nowrap !important;
    }

    #btn-next:hover {
      background: #FFF8DC !important;
      transform: translateY(-1px) !important;
    }

    /* تظبيط شاشة السؤال النشط */
    #screen-active-question {
      width: 100% !important;
      max-width: 1200px !important;
      margin: 0 auto !important;
      padding: 12px 20px 20px !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      gap: 14px !important;
    }

    #screen-active-question.hidden {
      display: none !important;
    }

    /* كارت السؤال */
    #screen-active-question .q-header {
      position: static !important;
      margin: 0 auto !important;
      width: 100% !important;
      max-width: 960px !important;
      padding: 20px 28px !important;
      box-sizing: border-box !important;
      border-radius: 22px !important;
      box-shadow: 0 10px 26px rgba(11, 30, 54, 0.16) !important;
    }

    #screen-active-question .q-header h1 {
      margin: 0 !important;
      line-height: 1.4 !important;
    }

    /* صف العدادات والصورة/اللوجو */
    #screen-active-question .q-middle {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 16px !important;
      width: 100% !important;
      max-width: 960px !important;
      margin: 0 auto !important;
      position: relative !important;
      z-index: 2 !important;
      box-sizing: border-box !important;
    }

    /* عداد الثواني */
    #screen-active-question .timer-wrapper {
      position: static !important;
      transform: none !important;
      flex-shrink: 0 !important;
    }

    /* كبسولة عداد الإجابات (0 Answers) عشان تبان بوضوح */
    #screen-active-question .answers-counter-wrapper {
      position: static !important;
      transform: none !important;
      flex-shrink: 0 !important;
      background: #0B1E36 !important;
      color: #ffffff !important;
      border: 3px solid #E4B93C !important;
      border-radius: 18px !important;
      padding: 10px 18px !important;
      min-width: 92px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 6px 16px rgba(11, 30, 54, 0.25) !important;
    }

    #screen-active-question .answers-counter-wrapper #q-answers-count {
      font-size: 1.75rem !important;
      font-weight: 900 !important;
      color: #F3C66F !important;
      line-height: 1.1 !important;
    }

    #screen-active-question .answers-counter-wrapper small {
      font-size: 0.78rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
      margin-top: 2px !important;
    }

    /* صندوق الميديا / اللوجو في النص */
    #q-media-container {
      position: relative !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex: 1 1 auto !important;
      max-width: 420px !important;
      min-height: 84px !important;
      margin: 0 auto !important;
      box-sizing: border-box !important;
      border-radius: 16px !important;
    }

    #q-media-container #q-image {
      max-width: 100% !important;
      max-height: 160px !important;
      object-fit: contain !important;
      position: static !important;
      border-radius: 12px !important;
    }

    #q-placeholder {
      position: static !important;
      transform: none !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px !important;
      padding: 8px 14px !important;
      width: 100% !important;
      height: auto !important;
      box-sizing: border-box !important;
      text-align: center !important;
    }

    #q-placeholder .kq-ph-logo {
      max-width: 150px !important;
      max-height: 48px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
    }

    /* شبكة الاختيارات */
    #host-answers-grid {
      position: relative !important;
      z-index: 2 !important;
      width: 100% !important;
      max-width: 1120px !important;
      margin: 0 auto !important;
      clear: both !important;
    }

    @media (max-width: 680px) {
      .header-left-spacer {
        display: none !important;
      }

      .game-header {
        padding: 10px 14px !important;
      }

      #btn-next {
        padding: 7px 14px !important;
        font-size: 0.85rem !important;
      }

      #screen-active-question {
        padding: 10px 12px 16px !important;
        gap: 10px !important;
      }

      #screen-active-question .q-header {
        padding: 14px 16px !important;
      }

      #screen-active-question .q-middle {
        flex-wrap: wrap !important;
        gap: 10px !important;
      }

      #screen-active-question .answers-counter-wrapper {
        padding: 7px 14px !important;
        min-width: 78px !important;
      }

      #screen-active-question .answers-counter-wrapper #q-answers-count {
        font-size: 1.4rem !important;
      }

      #q-media-container {
        order: 3 !important;
        flex: 1 1 100% !important;
        max-width: 100% !important;
        width: 100% !important;
        min-height: 76px !important;
        height: auto !important;
        padding: 8px 10px !important;
      }

      #q-media-container #q-image {
        max-height: 120px !important;
      }

      #q-placeholder .kq-ph-cross {
        font-size: 15px !important;
        line-height: 1 !important;
      }

      #q-placeholder .kq-ph-logo {
        max-width: 120px !important;
        max-height: 36px !important;
      }

      #q-placeholder .kq-ph-sub {
        display: block !important;
        font-size: 9.5px !important;
        letter-spacing: 1.4px !important;
        line-height: 1.2 !important;
      }
    }
  </style>
</head>
<body>

  <header class="game-header">
    <div class="header-left-spacer"></div>
    <div class="brand">
      <span class="kq-brand-animated">✝ Kokquiz</span>
    </div>
    <div class="header-right-controls">
      <button id="btn-next" style="display:none;">Next ▶</button>
      <div class="player-count">👤 <span id="header-players">0</span></div>
    </div>
  </header>

  <main class="game-container">
    
    <section id="screen-get-ready" class="screen-center active">
      <h1 class="huge-title">Get Ready!</h1>
      <div class="loader-spinner"></div>
    </section>

    <section id="screen-countdown" class="screen-center hidden">
      <div class="diamond-shape"><span id="countdown-text">3</span></div>
    </section>

    <section id="screen-question-info" class="screen-center hidden">
      <div class="question-type-badge"><div class="shapes-mini" id="info-shapes">▲ ◆ ● ■</div></div>
      <h1 id="info-q-text" class="info-title">السؤال...</h1>
      <div class="info-loader"><div class="info-bar"></div></div>
    </section>

    <section id="screen-active-question" class="screen-layout hidden">
      <div class="q-header"><h1 id="active-q-text">السؤال هنا؟</h1></div>
      <div class="q-middle">
        <div class="timer-wrapper"><div class="timer-circle" id="q-timer">20</div></div>
        <div class="q-media" id="q-media-container">
          <img id="q-image" src="" style="display:none;">
          <div class="media-placeholder" id="q-placeholder">
            <span class="kq-ph-cross">✝</span>
            <img class="kq-ph-logo" src="../kokquiz-logo.png" alt="Kokquiz">
            <span class="kq-ph-sub">Learn · Play · Grow</span>
          </div>
        </div>
        <div class="answers-counter-wrapper">
          <span id="q-answers-count">0</span><small>Answers</small>
        </div>
      </div>
      <div class="q-answers-grid" id="host-answers-grid">
        <div class="ans-box bg-red"><span class="shape">▲</span><span class="text" id="ans-0">---</span><span class="status-icon" id="stat-0"></span></div>
        <div class="ans-box bg-blue"><span class="shape">◆</span><span class="text" id="ans-1">---</span><span class="status-icon" id="stat-1"></span></div>
        <div class="ans-box bg-yellow"><span class="shape">●</span><span class="text" id="ans-2">---</span><span class="status-icon" id="stat-2"></span></div>
        <div class="ans-box bg-green"><span class="shape">■</span><span class="text" id="ans-3">---</span><span class="status-icon" id="stat-3"></span></div>
      </div>
    </section>

    <section id="screen-results" class="screen-center hidden" style="justify-content: flex-end; padding-bottom: 30px;">
      <h1 id="result-q-text" style="margin-bottom: 50px; font-size: 2.5rem; text-align: center;">السؤال هنا؟</h1>
      <div class="chart-container">
        <div class="bar-wrapper"><div class="bar bg-red" id="bar-0"><span class="bar-count" id="count-0">0</span></div><div class="bar-base">▲</div></div>
        <div class="bar-wrapper"><div class="bar bg-blue" id="bar-1"><span class="bar-count" id="count-1">0</span></div><div class="bar-base">◆</div></div>
        <div class="bar-wrapper" id="wrap-2"><div class="bar bg-yellow" id="bar-2"><span class="bar-count" id="count-2">0</span></div><div class="bar-base">●</div></div>
        <div class="bar-wrapper" id="wrap-3"><div class="bar bg-green" id="bar-3"><span class="bar-count" id="count-3">0</span></div><div class="bar-base">■</div></div>
      </div>
    </section>

    <section id="screen-leaderboard" class="screen-center hidden" style="justify-content: flex-start; padding-top: 40px;">
      <h1 class="huge-title" style="margin-bottom: 40px;">Top 5</h1>
      <div class="leaderboard-list" id="leaderboard-list"></div>
    </section>

    <!-- شاشة التتويج النهائية (Final Podium) المنسقة -->
    <section id="screen-final-podium" class="screen-center hidden" style="justify-content: flex-end; padding-bottom: 0;">
      <h1 class="podium-main-title">Podium</h1>
      <div class="podium-container">
        <!-- المركز الثاني (يسار) -->
        <div class="podium-place place-2 hidden" id="podium-2">
          <div class="winner-info">
            <span class="w-name" id="w-name-2">---</span>
            <span class="w-score" id="w-score-2">0</span>
          </div>
          <div class="podium-block block-2">
            <div class="medal medal-silver">2</div>
          </div>
        </div>
        <!-- المركز الأول (وسط وأعلى) -->
        <div class="podium-place place-1 hidden" id="podium-1">
          <div class="winner-info winner-first">
            <span class="w-name" id="w-name-1">---</span>
            <span class="w-score" id="w-score-1">0</span>
          </div>
          <div class="podium-block block-1">
            <div class="medal medal-gold">1</div>
          </div>
        </div>
        <!-- المركز الثالث (يمين) -->
        <div class="podium-place place-3 hidden" id="podium-3">
          <div class="winner-info">
            <span class="w-name" id="w-name-3">---</span>
            <span class="w-score" id="w-score-3">0</span>
          </div>
          <div class="podium-block block-3">
            <div class="medal medal-bronze">3</div>
          </div>
        </div>
      </div>
      <button class="btn-return-admin hidden" id="btn-return-admin">Return to Dashboard</button>
    </section>

  </main>

  <!-- ⚠️ الترتيب مهم: SignalR الأول، بعدين apin.js، بعدين ملف الصفحة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="../JS/countdown.js"></script>
  <script src="../JS/apin.js"></script>
  <script src="../JS/host-gamenn.js"></script>
  <script>
    // قفل الجلسة تلقائياً بمجرد ظهور شاشة التتويج النهائية
    (function () {
      const podiumEl = document.getElementById("screen-final-podium");
      if (!podiumEl) return;
      const markSessionFinished = () => {
        if (!podiumEl.classList.contains("hidden")) {
          try {
            const raw = localStorage.getItem("churchQuizGameSession");
            if (raw) {
              const s = JSON.parse(raw);
              if (s && s.status !== "finished") {
                s.status = "finished";
                localStorage.setItem("churchQuizGameSession", JSON.stringify(s));
              }
            }
          } catch {}
        }
      };
      new MutationObserver(markSessionFinished).observe(podiumEl, { attributes: true, attributeFilter: ["class"] });
    })();
  </script>
</body>
</html>
